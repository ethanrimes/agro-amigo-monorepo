name: agroamigo_iphone
description: Native-iOS-styled Flutter port of AgroAmigo (Colombian agricultural prices).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  intl: ^0.20.1
  cached_network_image: ^3.4.1
  fl_chart: ^0.71.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  go_router: ^14.6.2

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/colombia-departments.json
    - assets/icon.png
    - assets/splash-icon.png
    - assets/adaptive-icon.png
