name: Web and Android checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipelines/news/requirements.txt
      - run: python -m pip install -r pipelines/news/requirements.txt
      - run: python -m unittest pipelines.news.test_news
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: python -m compileall -q pipelines infra
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew assembleDebug lintDebug
        working-directory: apps/android
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: agroamigo-android-demo
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
