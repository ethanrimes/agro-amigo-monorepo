name: agroamigo-iphone-build

on:
  push:
    paths:
      - 'agroamigo-iphone/**'
      - '.github/workflows/agroamigo-iphone-build.yml'
  pull_request:
    paths:
      - 'agroamigo-iphone/**'
      - '.github/workflows/agroamigo-iphone-build.yml'
  workflow_dispatch:

concurrency:
  group: agroamigo-iphone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # PR + branch check: unsigned analyze + build (fast, ~4 min)
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: iOS build (Flutter, Xcode 26)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: agroamigo-iphone

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: ls /Applications | grep -i Xcode || true
        working-directory: .

      - name: Select Xcode (prefer 26, fall back to latest)
        run: |
          if [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
          fi
          xcodebuild -version
        working-directory: .

      - name: Set up Flutter (3.35.x stable, Xcode 26 compatible)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - name: Disable Flutter SwiftPM (avoid Xcode 26 plugin signing conflicts)
        run: flutter config --no-enable-swift-package-manager

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Bootstrap missing iOS scaffold
        run: |
          flutter create \
            --project-name agroamigo_iphone \
            --org com.ethankallett.agroamigo \
            --platforms=ios \
            --no-overwrite \
            .

      - name: Configure iOS deployment target (iOS 15)
        run: |
          if [ -f ios/Podfile ]; then
            sed -i '' "s/# platform :ios, .*/platform :ios, '15.0'/" ios/Podfile || true
            sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/Podfile || true
            grep -q "^platform :ios" ios/Podfile || (echo "platform :ios, '15.0'" | cat - ios/Podfile > /tmp/podfile && mv /tmp/podfile ios/Podfile)
          fi
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" ios/Runner.xcodeproj/project.pbxproj || true

      - name: Strip code signing from Pods targets
        run: |
          # Flutter's Podfile already defines a post_install hook calling
          # flutter_additional_ios_build_settings(target). Inject our extra
          # build setting overrides right after that line so they apply to
          # every Pods target.
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('ios/Podfile')
          src = p.read_text()
          inject = (
              "    target.build_configurations.each do |config|\n"
              "      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'\n"
              "      config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'\n"
              "      config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'\n"
              "      config.build_settings['CODE_SIGN_IDENTITY'] = ''\n"
              "      config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''\n"
              "      config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''\n"
              "      config.build_settings['DEVELOPMENT_TEAM'] = ''\n"
              "    end\n"
          )
          # Insert immediately after the flutter_additional_ios_build_settings line
          new = re.sub(
              r'(flutter_additional_ios_build_settings\(target\)\s*\n)',
              r'\1' + inject,
              src,
              count=1,
          )
          if new == src:
              raise SystemExit('Failed to inject Pods codesign override (pattern not found)')
          p.write_text(new)
          PY
          cat ios/Podfile

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter build iOS (release, no codesign)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL="${SUPABASE_URL:-https://placeholder.supabase.co}" \
            --dart-define=SUPABASE_KEY="${SUPABASE_KEY:-placeholder-anon-key}"

      - name: Upload build artifact (Runner.app)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Runner-app
          path: agroamigo-iphone/build/ios/iphoneos/Runner.app
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────
  # main only: signed IPA + TestFlight upload
  # ─────────────────────────────────────────────────────────────────────
  release:
    name: Release to TestFlight
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: agroamigo-iphone
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID_NATIVE }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (prefer 26, fall back to latest)
        run: |
          if [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
          fi
          xcodebuild -version
        working-directory: .

      - name: Set up Flutter (3.35.x stable, Xcode 26 compatible)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - name: Disable Flutter SwiftPM (avoid Xcode 26 plugin signing conflicts)
        run: flutter config --no-enable-swift-package-manager

      - name: Bootstrap missing iOS scaffold
        run: |
          flutter create \
            --project-name agroamigo_iphone \
            --org com.ethankallett.agroamigo \
            --platforms=ios \
            --no-overwrite \
            .

      - name: Configure iOS deployment target (iOS 15)
        run: |
          if [ -f ios/Podfile ]; then
            sed -i '' "s/# platform :ios, .*/platform :ios, '15.0'/" ios/Podfile || true
            sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/Podfile || true
            grep -q "^platform :ios" ios/Podfile || (echo "platform :ios, '15.0'" | cat - ios/Podfile > /tmp/podfile && mv /tmp/podfile ios/Podfile)
          fi
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" ios/Runner.xcodeproj/project.pbxproj || true

      - name: Strip code signing from Pods targets
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('ios/Podfile')
          src = p.read_text()
          inject = (
              "    target.build_configurations.each do |config|\n"
              "      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'\n"
              "      config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'\n"
              "      config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'\n"
              "      config.build_settings['CODE_SIGN_IDENTITY'] = ''\n"
              "      config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''\n"
              "      config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ''\n"
              "      config.build_settings['DEVELOPMENT_TEAM'] = ''\n"
              "    end\n"
          )
          new = re.sub(
              r'(flutter_additional_ios_build_settings\(target\)\s*\n)',
              r'\1' + inject,
              src,
              count=1,
          )
          if new == src:
              raise SystemExit('Failed to inject Pods codesign override (pattern not found)')
          p.write_text(new)
          PY
          cat ios/Podfile

      - name: Patch Runner bundle identifier
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${BUNDLE_ID}" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${BUNDLE_ID}.RunnerTests" ios/RunnerTests/Info.plist 2>/dev/null || true
          # Also update the pbxproj so the build phases agree
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com\.ethankallett\.agroamigo\.agroamigoIphone;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com\.ethankallett\.agroamigo\.agroamigoIphone\.RunnerTests;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID}.RunnerTests;/g" ios/Runner.xcodeproj/project.pbxproj || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          set -euo pipefail
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | xargs)
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
        working-directory: .

      - name: Install provisioning profile
        env:
          PROVISION_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_NATIVE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo -n "$PROVISION_BASE64" | base64 --decode > "$PROFILE_DIR/agroamigo_native.mobileprovision"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$PROFILE_DIR/agroamigo_native.mobileprovision")")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i "$PROFILE_DIR/agroamigo_native.mobileprovision")")
          mv "$PROFILE_DIR/agroamigo_native.mobileprovision" "$PROFILE_DIR/$UUID.mobileprovision"
          echo "PROVISION_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROVISION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Installed profile: $NAME ($UUID)"
        working-directory: .

      - name: Write ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROVISION_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build Flutter (release, no codesign)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL="${SUPABASE_URL:-https://placeholder.supabase.co}" \
            --dart-define=SUPABASE_KEY="${SUPABASE_KEY:-placeholder-anon-key}"

      - name: Archive with manual signing
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AgroAmigoNative.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROVISION_NAME}" \
            archive

      - name: Export signed IPA
        run: |
          set -euo pipefail
          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AgroAmigoNative.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/ExportOptions.plist
          cp "$RUNNER_TEMP/export/"*.ipa build/ios/ipa/

      - name: Locate IPA
        id: ipa
        run: |
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "ipa_path=$IPA" >> "$GITHUB_OUTPUT"
          echo "Found IPA: $IPA"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$API_KEY_B64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          xcrun altool --upload-app \
            -f "${{ steps.ipa.outputs.ipa_path }}" \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agroamigo-native-ipa
          path: agroamigo-iphone/build/ios/ipa/*.ipa
          if-no-files-found: warn

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8 || true
        working-directory: .
