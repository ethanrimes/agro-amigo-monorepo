name: agroamigo-app-ios-build

on:
  push:
    paths:
      - 'agroamigo-app/**'
      - '.github/workflows/agroamigo-app-ios-build.yml'
  pull_request:
    paths:
      - 'agroamigo-app/**'
      - '.github/workflows/agroamigo-app-ios-build.yml'
  workflow_dispatch:

concurrency:
  group: agroamigo-app-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # PR + branch check: unsigned build (fast)
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: iOS build (React Native / Expo)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: agroamigo-app
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID_REACT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (prefer 26, fall back to latest)
        run: |
          if [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
          fi
          xcodebuild -version
        working-directory: .

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agroamigo-app/package-lock.json

      - name: Setup Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install CocoaPods
        run: gem install cocoapods --no-document
        working-directory: .

      - name: npm install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Expo prebuild (generate ios/)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Pod install
        run: pod install
        working-directory: agroamigo-app/ios

      - name: Find xcworkspace + scheme
        id: ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME"  >> "$GITHUB_OUTPUT"
          echo "Workspace: $WS  Scheme: $SCHEME"
        working-directory: agroamigo-app/ios

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.ios.outputs.workspace }}" \
            -scheme "${{ steps.ios.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
        working-directory: agroamigo-app/ios

  # ─────────────────────────────────────────────────────────────────────
  # main only: signed IPA + TestFlight upload
  # ─────────────────────────────────────────────────────────────────────
  release:
    name: Release to TestFlight
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: agroamigo-app
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID_REACT }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (prefer 26, fall back to latest)
        run: |
          if [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
          fi
          xcodebuild -version
        working-directory: .

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agroamigo-app/package-lock.json

      - name: Setup Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Install CocoaPods
        run: gem install cocoapods --no-document
        working-directory: .

      - name: npm install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Expo prebuild (generate ios/)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Pod install
        run: pod install
        working-directory: agroamigo-app/ios

      - name: Find xcworkspace + scheme
        id: ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME"  >> "$GITHUB_OUTPUT"
          echo "Workspace: $WS  Scheme: $SCHEME"
        working-directory: agroamigo-app/ios

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          set -euo pipefail
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | xargs)
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
        working-directory: .

      - name: Install provisioning profile
        env:
          PROVISION_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_REACT_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo -n "$PROVISION_BASE64" | base64 --decode > "$PROFILE_DIR/agroamigo_react.mobileprovision"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i "$PROFILE_DIR/agroamigo_react.mobileprovision")")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i "$PROFILE_DIR/agroamigo_react.mobileprovision")")
          mv "$PROFILE_DIR/agroamigo_react.mobileprovision" "$PROFILE_DIR/$UUID.mobileprovision"
          echo "PROVISION_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROVISION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Installed profile: $NAME ($UUID)"
        working-directory: .

      - name: Write ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROVISION_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.ios.outputs.workspace }}" \
            -scheme "${{ steps.ios.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AgroAmigoReact.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROVISION_NAME}" \
            archive
        working-directory: agroamigo-app/ios

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AgroAmigoReact.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Locate IPA
        id: ipa
        run: |
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          echo "ipa_path=$IPA" >> "$GITHUB_OUTPUT"
          echo "Found IPA: $IPA"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$API_KEY_B64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          xcrun altool --upload-app \
            -f "${{ steps.ipa.outputs.ipa_path }}" \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agroamigo-react-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8 || true
        working-directory: .
