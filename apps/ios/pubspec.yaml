name: agroamigo_iphone
description: AgroAmigo for iOS, sharing the Azure farmer and purchaser experience.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: 4.13.1
  webview_flutter_wkwebview: 3.25.0
  url_launcher: 6.3.2
  share_plus: 11.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
